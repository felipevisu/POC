<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace Flow</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4;
    --code-bg: #f1f1ee; --hl: #fff2b3;
    --view: #2f7d6d; --controller: #3b63c4; --service: #8a55c2; --data: #c26a2e; --db: #a83a3a; --external: #5f6b7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --line: #34342f;
      --code-bg: #262624; --hl: #4a4220;
      --view: #5cb8a4; --controller: #7c9cf0; --service: #b78ae6; --data: #e6995f; --db: #e07070; --external: #9aa6b5;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --line: #34342f;
    --code-bg: #262624; --hl: #4a4220;
    --view: #5cb8a4; --controller: #7c9cf0; --service: #b78ae6; --data: #e6995f; --db: #e07070; --external: #9aa6b5;
  }
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  header h1 { font-size: 17px; flex: 1 1 300px; margin: 0; font-family: ui-monospace, monospace; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; background: var(--c); vertical-align: -1px; }
  input[type=search] { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); min-width: 200px; }
  main { display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
  #cy { min-height: 0; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px; }
  aside h2 { font-size: 18px; margin: 0 0 4px; word-break: break-word; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .meta a { color: inherit; }
  .explanation { white-space: pre-wrap; margin: 8px 0 12px; }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; }
  aside ul { margin: 0; padding-left: 18px; }
  aside li { margin: 3px 0; }
  aside li a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  .io { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 13px; }
  .io b { color: var(--muted); font-weight: 500; }
  .attention li::marker { content: "⚠ "; }
  .migration { background: var(--code-bg); border-radius: 6px; padding: 6px 10px; margin: 4px 0; }
  pre { background: var(--code-bg); padding: 8px 0; border-radius: 6px; overflow: auto; font-size: 12px; margin: 8px 0; }
  pre div { padding: 0 10px; white-space: pre; }
  pre div.hl { background: var(--hl); }
  pre span.ln { color: var(--muted); display: inline-block; width: 3.5em; user-select: none; }
  .empty { color: var(--muted); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1 id="entry"></h1>
  <div class="legend" id="legend"></div>
  <input type="search" id="search" placeholder="Search node (e.g. saldo)" aria-label="Search node">
</header>
<main>
  <div id="cy" role="img" aria-label="Data flow graph"></div>
  <aside id="panel"></aside>
</main>
<script>
const GRAPH = {"entry": "/cliente/detalhe.do", "field": "Saldo (balance)", "summary": "The balance comes from CONTA.SALDO; for individuals (PF) CONTA.BLOQUEADO is subtracted, for companies (PJ) it is not. Formatted as pt-BR currency in the Action.", "nodes": [{"id": "n1", "kind": "url", "layer": "controller", "label": "GET /cliente/detalhe.do?id=", "file": "WebContent/WEB-INF/struts-config.xml", "line": 11, "anchor": "/cliente/detalhe", "explanation": "Mapping in struts-config.xml: the URL /cliente/detalhe.do triggers DetalheClienteAction with the request-scoped form clienteForm. The customer id arrives as a URL parameter and Struts populates it into the form.", "data_in": "?id=<customer id> (query string)", "data_out": "ClienteForm.id populated", "snippet": {"start": 5, "lines": ["    <form-bean name=\"clienteForm\" type=\"com.acme.web.ClienteForm\"/>", "  <\/form-beans>", "  <global-forwards>", "    <forward name=\"erro\" path=\"/WEB-INF/jsp/erro.jsp\"/>", "  <\/global-forwards>", "  <action-mappings>", "    <action path=\"/cliente/detalhe\" type=\"com.acme.web.DetalheClienteAction\" name=\"clienteForm\" scope=\"request\">", "      <forward name=\"sucesso\" path=\"cliente.detalhe\"/>", "    <\/action>", "  <\/action-mappings>", "<\/struts-config>"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/WebContent/WEB-INF/struts-config.xml"}, {"id": "n2", "kind": "action", "layer": "controller", "label": "DetalheClienteAction.execute", "file": "src/main/java/com/acme/web/DetalheClienteAction.java", "line": 13, "anchor": "public ActionForward execute", "explanation": "Entry point of the screen. Reads the id from the form, asks the service for the name and the balance, formats the balance as currency and puts it in the request for the JSP. It is the only Action involved for this field.", "data_in": "ClienteForm.id", "data_out": "request: saldoFormatado (String), cotacao; form.nome", "migration": "Becomes the REST controller. All data assembly here should move to the service; formatting moves to the frontend.", "snippet": {"start": 7, "lines": ["import javax.servlet.http.*;", "import org.apache.struts.action.*;", "", "public class DetalheClienteAction extends Action {", "    private final ClienteService service = new ClienteService();", "", "    public ActionForward execute(ActionMapping mapping, ActionForm form,", "                                 HttpServletRequest request, HttpServletResponse response) throws Exception {", "        ClienteForm f = (ClienteForm) form;", "        f.setNome(service.buscarNome(f.getId()));", "        BigDecimal saldo = service.saldoDisponivel(f.getId());", "        String saldoFormatado = NumberFormat.getCurrencyInstance(new Locale(\"pt\", \"BR\")).format(saldo);", "        request.setAttribute(\"saldoFormatado\", saldoFormatado);"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/src/main/java/com/acme/web/DetalheClienteAction.java"}, {"id": "n3", "kind": "service", "layer": "service", "label": "ClienteService.saldoDisponivel", "file": "src/main/java/com/acme/service/ClienteService.java", "line": 15, "anchor": "saldoDisponivel", "explanation": "Computes the available balance. Fetches balance and blocked amount in a single query and, depending on the person type, decides whether to subtract the blocked amount.", "data_in": "id (String)", "data_out": "BigDecimal: available balance", "rules": ["PF: SALDO − BLOQUEADO", "PJ: full SALDO"], "migration": "Core business rule: keep it in the new backend with tests for both PF and PJ.", "snippet": {"start": 9, "lines": ["    private final CotacaoClient cotacao = new CotacaoClient();", "", "    public String buscarNome(String id) throws Exception {", "        return dao.nome(id);", "    }", "", "    public BigDecimal saldoDisponivel(String id) throws Exception {", "        BigDecimal[] s = dao.saldoEBloqueado(id);", "        if (dao.isPJ(id)) {", "            return s[0];", "        }", "        return s[0].subtract(s[1]);", "    }"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/src/main/java/com/acme/service/ClienteService.java"}, {"id": "n4", "kind": "dao", "layer": "data", "label": "ClienteDAO.saldoEBloqueado", "file": "src/main/java/com/acme/dao/ClienteDAO.java", "line": 17, "anchor": "saldoEBloqueado", "explanation": "Runs the SELECT on CONTA filtered by customer id and returns an array of two BigDecimal: [0]=SALDO, [1]=BLOQUEADO.", "data_in": "id (String)", "data_out": "BigDecimal[] { SALDO, BLOQUEADO }", "attention": ["Calls rs.next() and ignores the result: if there is no account, getBigDecimal throws.", "Assumes a single account per customer."], "migration": "Equivalent repository/query; handle 'customer without account' explicitly (404 or zero balance, decide with the business).", "snippet": {"start": 11, "lines": ["            ps.setString(1, id);", "            ResultSet rs = ps.executeQuery();", "            return rs.next() ? rs.getString(\"NOME\") : null;", "        }", "    }", "", "    public BigDecimal[] saldoEBloqueado(String id) throws SQLException {", "        try (Connection c = Db.get(); PreparedStatement ps = c.prepareStatement(SQL_SALDO)) {", "            ps.setString(1, id);", "            ResultSet rs = ps.executeQuery();", "            rs.next();", "            return new BigDecimal[] { rs.getBigDecimal(\"SALDO\"), rs.getBigDecimal(\"BLOQUEADO\") };", "        }"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/src/main/java/com/acme/dao/ClienteDAO.java"}, {"id": "n5", "kind": "sql", "layer": "data", "label": "SELECT SALDO, BLOQUEADO FROM CONTA", "file": "src/main/java/com/acme/dao/ClienteDAO.java", "line": 7, "anchor": "SELECT SALDO, BLOQUEADO FROM CONTA", "explanation": "Static SQL in a constant (SQL_SALDO). Uses a PreparedStatement with a bound parameter, so there is no SQL injection risk here.", "data_out": "columns SALDO, BLOQUEADO", "snippet": {"start": 1, "lines": ["package com.acme.dao;", "", "import java.math.BigDecimal;", "import java.sql.*;", "", "public class ClienteDAO {", "    private static final String SQL_SALDO = \"SELECT SALDO, BLOQUEADO FROM CONTA WHERE CLIENTE_ID = ?\";", "", "    public String nome(String id) throws SQLException {", "        try (Connection c = Db.get(); PreparedStatement ps = c.prepareStatement(\"SELECT NOME FROM CLIENTE WHERE ID = ?\")) {", "            ps.setString(1, id);", "            ResultSet rs = ps.executeQuery();", "            return rs.next() ? rs.getString(\"NOME\") : null;"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/src/main/java/com/acme/dao/ClienteDAO.java"}, {"id": "n6", "kind": "table", "layer": "db", "label": "CONTA.SALDO", "explanation": "Column with the account's ledger balance. Read via rs.getBigDecimal(\"SALDO\") and becomes s[0] in the service.", "data_out": "BigDecimal"}, {"id": "n7", "kind": "table", "layer": "db", "label": "CONTA.BLOQUEADO", "explanation": "Amount blocked on the account (e.g. court order, uncleared check). Only used for individuals (PF).", "data_out": "BigDecimal"}, {"id": "n8", "kind": "dao", "layer": "data", "label": "ClienteDAO.isPJ", "file": "src/main/java/com/acme/dao/ClienteDAO.java", "line": 26, "anchor": "isPJ", "explanation": "Decides whether the customer is a company (PJ) by looking only at the id length: 14 characters = CNPJ. Does not query the database, despite living in the DAO.", "data_in": "id (String)", "data_out": "boolean", "rules": ["id with 14 characters → PJ", "any other length → PF"], "attention": ["Fragile: a masked id ('12.345.678/0001-90') has 18 characters and would be treated as PF.", "Domain rule hidden in the data layer."], "migration": "Use an explicit person-type column if one exists; otherwise isolate the rule in a tested domain function.", "snippet": {"start": 20, "lines": ["            ResultSet rs = ps.executeQuery();", "            rs.next();", "            return new BigDecimal[] { rs.getBigDecimal(\"SALDO\"), rs.getBigDecimal(\"BLOQUEADO\") };", "        }", "    }", "", "    public boolean isPJ(String id) throws SQLException {", "        return id.length() == 14;", "    }", "}"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/src/main/java/com/acme/dao/ClienteDAO.java"}, {"id": "n9", "kind": "transform", "layer": "service", "label": "balance - blocked (PF)", "file": "src/main/java/com/acme/service/ClienteService.java", "line": 20, "anchor": "subtract", "explanation": "For individuals (PF), the displayed balance is the balance minus the blocked amount.", "data_in": "SALDO, BLOQUEADO", "data_out": "SALDO − BLOQUEADO", "rules": ["PF available balance = SALDO − BLOQUEADO"], "snippet": {"start": 14, "lines": ["", "    public BigDecimal saldoDisponivel(String id) throws Exception {", "        BigDecimal[] s = dao.saldoEBloqueado(id);", "        if (dao.isPJ(id)) {", "            return s[0];", "        }", "        return s[0].subtract(s[1]);", "    }", "", "    public Object cotacaoDolar() throws Exception {", "        return cotacao.buscar(\"USD\");", "    }", "}"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/src/main/java/com/acme/service/ClienteService.java"}, {"id": "n10", "kind": "transform", "layer": "controller", "label": "format as pt-BR currency", "file": "src/main/java/com/acme/web/DetalheClienteAction.java", "line": 18, "anchor": "format(saldo)", "explanation": "Converts the BigDecimal into Brazilian currency text (e.g. 1234.5 → \"R$ 1.234,50\"). From here on the value is no longer a number.", "data_in": "BigDecimal", "data_out": "String \"R$ 1.234,50\"", "attention": ["Hardcoded new Locale(\"pt\",\"BR\"): ignores the user's language."], "migration": "Remove from the backend. The endpoint returns a number; the frontend formats it.", "snippet": {"start": 12, "lines": ["", "    public ActionForward execute(ActionMapping mapping, ActionForm form,", "                                 HttpServletRequest request, HttpServletResponse response) throws Exception {", "        ClienteForm f = (ClienteForm) form;", "        f.setNome(service.buscarNome(f.getId()));", "        BigDecimal saldo = service.saldoDisponivel(f.getId());", "        String saldoFormatado = NumberFormat.getCurrencyInstance(new Locale(\"pt\", \"BR\")).format(saldo);", "        request.setAttribute(\"saldoFormatado\", saldoFormatado);", "        request.setAttribute(\"cotacao\", service.cotacaoDolar());", "        return mapping.findForward(\"sucesso\");", "    }", "}"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/src/main/java/com/acme/web/DetalheClienteAction.java"}, {"id": "n11", "kind": "other", "layer": "controller", "label": "request.saldoFormatado", "file": "src/main/java/com/acme/web/DetalheClienteAction.java", "line": 19, "anchor": "setAttribute(\"saldoFormatado\"", "explanation": "Puts the formatted text in the request under the name 'saldoFormatado'. That is the name the JSP looks up.", "data_out": "request attribute saldoFormatado", "snippet": {"start": 13, "lines": ["    public ActionForward execute(ActionMapping mapping, ActionForm form,", "                                 HttpServletRequest request, HttpServletResponse response) throws Exception {", "        ClienteForm f = (ClienteForm) form;", "        f.setNome(service.buscarNome(f.getId()));", "        BigDecimal saldo = service.saldoDisponivel(f.getId());", "        String saldoFormatado = NumberFormat.getCurrencyInstance(new Locale(\"pt\", \"BR\")).format(saldo);", "        request.setAttribute(\"saldoFormatado\", saldoFormatado);", "        request.setAttribute(\"cotacao\", service.cotacaoDolar());", "        return mapping.findForward(\"sucesso\");", "    }", "}"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/src/main/java/com/acme/web/DetalheClienteAction.java"}, {"id": "n12", "kind": "field", "layer": "view", "label": "Saldo field (detalhe.jsp)", "file": "WebContent/WEB-INF/jsp/cliente/detalhe.jsp", "line": 4, "anchor": "name=\"saldoFormatado\"", "explanation": "The JSP prints the saldoFormatado attribute with <bean:write>, with no further transformation.", "data_in": "request.saldoFormatado (String)", "snippet": {"start": 1, "lines": ["<%@ taglib uri=\"http://struts.apache.org/tags-bean\" prefix=\"bean\" %>", "<%@ include file=\"/WEB-INF/jsp/cabecalho.jspf\" %>", "<h1>Cliente <bean:write name=\"clienteForm\" property=\"nome\"/><\/h1>", "<p>Saldo: <bean:write name=\"saldoFormatado\"/><\/p>", "<p>Dólar hoje: ${cotacao.valor}<\/p>", "<logic:iterate id=\"c\" name=\"contas\">", "  <bean:write name=\"c\" property=\"numero\"/>", "<\/logic:iterate>"]}, "abs": "/Users/felipefaria/Projects/POC/ai/code-graph/examples/legacy-app/WebContent/WEB-INF/jsp/cliente/detalhe.jsp"}], "edges": [{"from": "n1", "to": "n2", "kind": "calls"}, {"from": "n2", "to": "n3", "kind": "calls"}, {"from": "n3", "to": "n4", "kind": "calls"}, {"from": "n4", "to": "n5", "kind": "calls"}, {"from": "n5", "to": "n6", "kind": "reads"}, {"from": "n5", "to": "n7", "kind": "reads"}, {"from": "n6", "to": "n3", "kind": "maps", "label": "rs.getBigDecimal(\"SALDO\") → s[0]", "explanation": "The SALDO column becomes position 0 of the array returned by the DAO."}, {"from": "n7", "to": "n9", "kind": "maps", "label": "rs.getBigDecimal(\"BLOQUEADO\") → s[1]"}, {"from": "n3", "to": "n8", "kind": "calls"}, {"from": "n8", "to": "n9", "kind": "branch", "label": "!isPJ(id)", "explanation": "When the customer is NOT a company, the service subtracts the blocked amount."}, {"from": "n8", "to": "n10", "kind": "branch", "label": "isPJ(id): s[0] without deduction", "explanation": "When it is a company, the service returns s[0] directly, no deduction."}, {"from": "n9", "to": "n10", "kind": "returns"}, {"from": "n10", "to": "n11", "kind": "transform", "label": "BigDecimal → \"R$ 1.234,56\""}, {"from": "n11", "to": "n12", "kind": "renders"}], "insights": {"rules": [{"text": "Individual (PF): displayed balance = SALDO − BLOQUEADO", "node": "n9"}, {"text": "Company (PJ): displayed balance = SALDO, blocked amount is not subtracted", "node": "n8"}, {"text": "PJ is detected by the id length (14 chars = CNPJ), not by a database column", "node": "n8"}, {"text": "Value displayed as Brazilian currency (R$, comma as decimal separator)", "node": "n10"}], "attention": [{"text": "rs.next() result is ignored: a customer without an account throws an error instead of showing zero", "node": "n4"}, {"text": "Formatting happens on the server; the page receives ready-made text, not a number", "node": "n10"}, {"text": "isPJ lives in the DAO but never touches the database: a domain rule in the wrong layer", "node": "n8"}], "migration": ["Suggested endpoint: GET /customers/{id}/balance → { balance: number, blocked: number, available: number, personType: 'PF'|'PJ' }", "Return the raw number and format it on the frontend (Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'}))", {"text": "Move the PF/PJ rule into the backend domain and cover both cases with tests", "node": "n3"}], "unresolved": []}};
const LAYERS = ["view", "controller", "service", "data", "db", "external"];
const SHAPES = { sql: "barrel", table: "barrel", external_api: "hexagon", branch: "diamond", transform: "cut-rectangle", field: "tag", jsp: "rectangle", url: "ellipse" };
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();

document.getElementById("entry").textContent = GRAPH.entry;
document.title = "Trace " + GRAPH.entry;
const legend = document.getElementById("legend");
for (const l of LAYERS) { const s = document.createElement("span"); s.textContent = l; s.style.setProperty("--c", css(l)); legend.append(s); }

cytoscape.use(cytoscapeDagre);
const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: [
    ...GRAPH.nodes.map(n => ({ data: { ...n, color: css(n.layer) || css("muted"), shape: SHAPES[n.kind] || "round-rectangle" } })),
    ...GRAPH.edges.map((e, i) => ({ data: { id: "e" + i, source: e.from, target: e.to, ...e } })),
  ],
  layout: { name: "dagre", rankDir: "LR", nodeSep: 60, rankSep: 180 },
  wheelSensitivity: 0.3,
  style: [
    { selector: "node", style: { label: "data(label)", shape: "data(shape)", "background-color": "data(color)", color: css("text"),
      "font-size": 11, "text-wrap": "wrap", "text-max-width": 150, "text-valign": "bottom", "text-margin-y": 4, width: 26, height: 26 } },
    { selector: "edge", style: { width: 1.5, "line-color": css("line"), "target-arrow-color": css("line"), "target-arrow-shape": "triangle",
      "curve-style": "bezier", label: "data(label)", "font-size": 9, color: css("muted"), "text-rotation": "autorotate", "text-background-color": css("bg"), "text-background-opacity": 1 } },
    { selector: "edge[kind = 'branch']", style: { "line-style": "dashed" } },
    { selector: "edge[kind = 'transform']", style: { "line-color": css("data"), "target-arrow-color": css("data") } },
    { selector: ".dim", style: { opacity: 0.12 } },
    { selector: "node:selected", style: { "border-width": 3, "border-color": css("text") } },
  ],
});

function line(no, text, hl) {
  const d = document.createElement("div"); if (hl) d.className = "hl";
  const ln = document.createElement("span"); ln.className = "ln"; ln.textContent = no;
  d.append(ln, text); return d;
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// items: strings or {text, node}; a node ref becomes a link that focuses it in the graph
function list(p, title, items, cls) {
  if (!items || !items.length) return;
  p.append(el("h3", null, title));
  const ul = el("ul", cls);
  for (const it of items) {
    const li = el("li"), text = typeof it === "string" ? it : it.text;
    if (it.node && cy.getElementById(it.node).length) {
      const a = el("a", null, text); a.href = "#"; a.onclick = ev => { ev.preventDefault(); focus(cy.getElementById(it.node)); }; li.append(a);
    } else li.textContent = text;
    ul.append(li);
  }
  p.append(ul);
}

function overview() {
  const p = document.getElementById("panel"); p.replaceChildren();
  p.append(el("h2", null, GRAPH.field ? `Field: ${GRAPH.field}` : "Overview"));
  p.append(el("div", "explanation", GRAPH.summary || ""));
  const ins = GRAPH.insights || {};
  list(p, "Business rules", ins.rules);
  list(p, "Watch out", ins.attention, "attention");
  list(p, "For the migration", ins.migration);
  list(p, "Unresolved", ins.unresolved);
  p.append(el("p", "empty", "Click a node to see what happens there and highlight its path. Click the background to come back here."));
}

function show(data) {
  const p = document.getElementById("panel"); p.replaceChildren();
  p.append(el("h2", null, data.label));
  const meta = el("div", "meta", [data.kind, data.layer].filter(Boolean).join(" · "));
  if (data.file) {
    const a = el("a", null, `${data.file}:${data.line}`); a.href = `vscode://file${data.abs || data.file}:${data.line}`;
    meta.append(document.createElement("br"), a);
  }
  p.append(meta);
  if (data.explanation) p.append(el("div", "explanation", data.explanation));
  if (data.data_in || data.data_out) {
    const io = el("div", "io");
    if (data.data_in) io.append(el("b", null, "In"), el("span", null, data.data_in));
    if (data.data_out) io.append(el("b", null, "Out"), el("span", null, data.data_out));
    p.append(el("h3", null, "Data"), io);
  }
  list(p, "Business rules", data.rules);
  list(p, "Watch out", data.attention, "attention");
  if (data.migration) p.append(el("h3", null, "For the migration"), el("div", "migration", data.migration));
  if (data.snippet) {
    p.append(el("h3", null, "Code"));
    const pre = document.createElement("pre");
    data.snippet.lines.forEach((t, i) => pre.append(line(data.snippet.start + i, t, data.snippet.start + i === data.line)));
    p.append(pre);
    pre.querySelector(".hl")?.scrollIntoView({ block: "center" });
  }
}

function focus(node) {
  const path = node.predecessors().union(node.successors()).union(node);
  cy.elements().addClass("dim"); path.removeClass("dim");
  show(node.data());
}
cy.on("tap", "node", e => focus(e.target));
cy.on("tap", "edge", e => show({ label: e.target.data("label") || e.target.data("kind"), kind: e.target.data("kind"), explanation: e.target.data("explanation") }));
cy.on("tap", e => { if (e.target === cy) { cy.elements().removeClass("dim"); overview(); } });
overview();

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase(); if (!q) return cy.elements().removeClass("dim");
  const hit = cy.nodes().filter(n => n.data("label").toLowerCase().includes(q));
  if (hit.length) { cy.$(":selected").unselect(); hit[0].select(); focus(hit[0]); cy.animate({ center: { eles: hit[0] } }); }
});
</script>
</body>
</html>
