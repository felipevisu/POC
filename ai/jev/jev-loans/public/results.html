<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eval replay · jev-loans</title>
<style>
  :root {
    --bg: #ffffff;
    --subtle: #f6f8fa;
    --border: #d0d7de;
    --border-muted: #e5e8eb;
    --fg: #1f2328;
    --muted: #59636e;
    --link: #0969da;
    --select: #ddf4ff;
    --ok: #1a7f37;
    --ok-strong: #1f883d;
    --bad: #cf222e;
    --bad-bg: #ffebe9;
    --bad-border: #ffcecb;
    --bad-fg: #a40e26;
    --user: #ddf4ff;
    --user-border: #b6e3ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  code, .mono { font-family: var(--mono); font-size: 12px; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--subtle); flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; flex: 1; }
  select { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }

  .summary { border-bottom: 1px solid var(--border); overflow-x: auto; }
  .summary table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .summary th, .summary td { text-align: left; padding: 6px 16px; white-space: nowrap; }
  .summary th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .summary td:first-child { font-weight: 600; }
  .summary tr + tr td { border-top: 1px solid var(--border-muted); }

  .wrap { flex: 1; display: flex; min-height: 0; }
  nav { width: 240px; flex: none; border-right: 1px solid var(--border); overflow-y: auto; padding: 8px 0; }
  nav button { display: block; width: 100%; text-align: left; font: inherit; color: var(--fg); background: none; border: 0; padding: 6px 16px; cursor: pointer; }
  nav button:hover { background: var(--subtle); }
  nav button[aria-current=true] { background: var(--select); }
  nav .name { display: block; font-family: var(--mono); font-size: 13px; }
  nav .marks { display: block; font-size: 12px; color: var(--muted); }

  .ok { color: var(--ok); }
  .bad { color: var(--bad); }

  main { flex: 1; min-width: 0; overflow: auto; }
  .grid { display: grid; gap: 0 1px; background: var(--border); min-height: 100%; align-content: start; }
  .grid > * { background: var(--bg); }

  .colhead { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .colhead h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 15px; font-weight: 600; }
  .state { font-size: 12px; font-weight: 500; color: #fff; border-radius: 2em; padding: 0 8px; line-height: 20px; }
  .state.ok { background: var(--ok-strong); }
  .state.bad { background: var(--bad); }
  .stats { margin-top: 2px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .checks { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
  .checks li { padding: 1px 0; }
  .checks .detail { color: var(--muted); }
  .path { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .path code { color: var(--fg); }
  .path code.miss { color: var(--bad); text-decoration: line-through; }

  .turn { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border-muted); }
  .turn-n { color: var(--muted); font-size: 12px; }
  .msg { max-width: 90%; padding: 8px 12px; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); border: 1px solid var(--user-border); }
  .bot { align-self: flex-start; border: 1px solid var(--border); }
  .bot.empty { color: var(--muted); font-style: italic; }
  .msg strong { font-weight: 600; }

  .tools { align-self: stretch; font-size: 12px; color: var(--muted); }
  .tools summary { cursor: pointer; line-height: 1.8; }
  .tools summary code { color: var(--fg); background: var(--subtle); border-radius: 4px; padding: 1px 5px; }
  .tools summary code.bad { color: var(--bad); }
  .tools summary .sep { margin: 0 2px; }
  .tools pre { font-family: var(--mono); font-size: 12px; color: var(--fg); background: var(--subtle); border: 1px solid var(--border-muted); border-radius: 6px; padding: 8px 10px; margin: 6px 0 0; overflow: auto; max-height: 320px; }

  .missing { font-size: 13px; color: var(--bad-fg); background: var(--bad-bg); border: 1px solid var(--bad-border); border-radius: 6px; padding: 6px 10px; }
  .missing ul { margin: 2px 0 0; padding-left: 18px; }

  .notice { margin: 32px auto; color: var(--muted); text-align: center; }
  .notice.bad { color: var(--bad); }

  @media (max-width: 800px) {
    .wrap { flex-direction: column; }
    nav { width: auto; max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>Eval replay</h1>
  <label for="run" hidden>Run</label>
  <select id="run"></select>
  <span class="meta" id="meta"></span>
  <a href="/">Open chat</a>
</header>
<div class="summary" id="summary"></div>
<div class="wrap">
  <nav id="nav" aria-label="Scenarios"></nav>
  <main id="main"><p class="notice">Loading…</p></main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const usd = (x) => '$' + (x ?? 0).toFixed(4);
  const secs = (ms) => ((ms ?? 0) / 1000).toFixed(1) + 's';
  const mark = (ok) => el('span', ok ? 'ok' : 'bad', ok ? '✓' : '✗');
  const withBold = (node, text) => {
    text.split(/\*\*(.+?)\*\*/g).forEach((part, i) => node.append(i % 2 ? el('strong', null, part) : part));
    return node;
  };

  const CHECKS = {
    tool_order: 'Expected tools called in order',
    turn_order: 'Tools called in the right turn',
    final_state: 'Backend ended in the expected state',
    cost: 'Within cost limit',
    latency: 'Within time limit',
  };

  function column(r) {
    const o = r.response?.output ?? {};
    const head = el('div', 'colhead');
    const h2 = el('h2', null, r.provider.label);
    h2.append(el('span', 'state ' + (r.success ? 'ok' : 'bad'), r.success ? 'Passed' : 'Failed'));
    head.append(h2);
    const tokens = (o.input_tokens ?? 0) + (o.output_tokens ?? 0) + (o.router_tokens ?? 0);
    const parts = [o.model, `${usd(o.cost_usd)}${o.router_cost_usd ? ` (router ${usd(o.router_cost_usd)})` : ''}`, secs(o.ms), `${tokens.toLocaleString()} tokens`];
    if (o.jev_routing) parts.push(`jev ${o.jev_routing}`);
    if (o.mode === 'jev' && o.route_ignored) parts.push(`${o.route_ignored} jev routes ignored`);
    head.append(el('div', 'stats', parts.filter(Boolean).join(' · ')));

    const checks = el('ul', 'checks');
    const comps = r.gradingResult?.componentResults ?? [];
    for (const c of comps.filter((c) => !c.pass)) {
      const key = c.assertion?.metric ?? c.assertion?.type;
      const li = el('li');
      li.append(mark(false), ' ', CHECKS[key] ?? key);
      const reason = String(c.reason ?? '').split('\n')[0];
      const detail = key === 'tool_order' ? `${o.expected_hit}/${o.expected_total}`
        : key === 'turn_order' ? `${o.turn_checks_passed}/${o.turn_checks_total} turns`
        : reason.startsWith('Custom function') ? '' : reason;
      if (detail) li.append(el('span', 'detail', ` — ${detail}`));
      checks.append(li);
    }
    const passed = comps.filter((c) => c.pass).length;
    if (passed) {
      const li = el('li', 'detail');
      li.append(mark(true), ` ${passed} ${passed === 1 ? 'check' : 'checks'} passed`);
      checks.append(li);
    }
    if (r.error && !comps.length) checks.append(el('li', 'bad', '✗ ' + r.error));
    head.append(checks);

    const turns = o.turns ?? [];
    const expect = o.expect ?? [];
    let hit = 0;
    let lastHitTurn = -1;
    turns.forEach((t, k) => {
      for (const st of t.trace ?? []) for (const c of st.calls) if (c.tool === expect[hit]) { hit++; lastHitTurn = k; }
    });
    const missing = expect.slice(hit);
    const stallTurn = lastHitTurn + 1;

    if (expect.length) {
      const path = el('div', 'path', 'Expected: ');
      expect.forEach((tool, k) => {
        if (k) path.append(' → ');
        path.append(el('code', k < hit ? null : 'miss', tool));
      });
      head.append(path);
    }

    const calledAnywhere = new Set(o.calls ?? []);
    const missingBlock = () => {
      const d = el('div', 'missing', 'Expected here but missing:');
      const ul = el('ul');
      for (const tool of missing) {
        const li = el('li');
        li.append(el('code', null, tool), calledAnywhere.has(tool) ? ' — called out of order' : ' — not called');
        ul.append(li);
      }
      d.append(ul);
      return d;
    };

    const cells = turns.map((t, k) => {
      const cell = el('div', 'turn');
      const label = el('div', 'turn-n', `Turn ${k + 1}`);
      if (t.check) {
        const c = t.check;
        label.append(' · ', mark(c.ok));
        const why = [
          ...c.missing.map((x) => `should call ${x}`),
          ...c.forbidden.map((x) => `called ${x} too early`),
        ];
        const rule = [c.expect.length && `expects ${c.expect.join(' → ')}`, c.forbid.length && `must not call ${c.forbid.join(', ')}`].filter(Boolean).join('; ');
        label.append(el('span', c.ok ? null : 'bad', ` ${c.ok ? 'right turn' : why.join(' · ')}`));
        label.title = rule;
      }
      cell.append(label);
      cell.append(el('div', 'msg user', t.customer));
      if (missing.length && k === stallTurn) cell.append(missingBlock());
      const steps = t.trace ?? [];
      const calls = steps.flatMap((st) => st.calls.map((c, i) => ({ ...c, route: st.route, output: st.results[i]?.output })));
      if (steps.length) {
        const d = el('details', 'tools');
        const s = el('summary');
        if (calls.length) {
          calls.forEach((c, i) => {
            if (i) s.append(el('span', 'sep', ' · '));
            s.append(el('code', c.output?.error ? 'bad' : null, c.tool));
          });
        } else {
          s.append('no tools');
        }
        const m = t.metrics ?? {};
        const ignored = steps.filter((st) => st.route && st.route !== 'no_tool' && !st.calls.some((c) => c.tool === st.route));
        const extra = [secs(m.ms), usd((m.chat_cost_usd ?? 0) + (m.router_cost_usd ?? 0))];
        if (ignored.length) extra.push(`jev suggested ${ignored.map((st) => st.route).join(', ')} (ignored)`);
        s.append(`  ${extra.join(' · ')}`);
        d.append(s);
        if (calls.length) {
          d.append(el('pre', null, JSON.stringify(calls.map(({ tool, input, output, route }) => ({ tool, ...(route ? { jev: route } : {}), input, output })), null, 2)));
        }
        cell.append(d);
      }
      cell.append(t.agent ? withBold(el('div', 'msg bot'), t.agent) : el('div', 'msg bot empty', 'No reply (step limit reached)'));
      return cell;
    });
    if (!o.turns) cells.push(el('div', 'turn notice', 'No conversation recorded for this run.'));
    let tail = null;
    if (missing.length && stallTurn >= turns.length) {
      tail = el('div', 'turn');
      tail.append(missingBlock());
    }
    return { head, cells, tail };
  }

  function render(data) {
    const rank = (label) => ['haiku', 'sonnet', 'opus'].findIndex((m) => label.startsWith(m)) * 2 + (label.includes('jev') ? 1 : 0);
    const results = [...data.results.results].sort((a, b) => rank(a.provider.label) - rank(b.provider.label) || a.provider.label.localeCompare(b.provider.label));
    const when = data.results.timestamp ? new Date(data.results.timestamp).toLocaleString() : '';
    $('meta').textContent = [when, data.evalId].filter(Boolean).join(' · ');

    const by = new Map();
    for (const r of results) {
      const o = r.response?.output ?? {};
      if (!by.has(r.provider.label)) by.set(r.provider.label, { n: 0, pass: 0, order: 0, turn: 0, cost: 0, ms: 0 });
      const b = by.get(r.provider.label);
      b.n++; b.pass += r.success ? 1 : 0; b.cost += o.cost_usd ?? 0; b.ms += o.ms ?? 0;
      b.order += o.expected_total != null && o.expected_hit === o.expected_total ? 1 : 0;
      b.turn += o.turn_ok ? 1 : 0;
    }
    const table = el('table');
    const hr = el('tr');
    for (const h of ['Provider', 'Passed', 'Right order', 'Right turn', 'Total cost', 'Cost per pass', 'Avg time']) hr.append(el('th', null, h));
    table.append(hr);
    for (const [label, b] of by) {
      const tr = el('tr');
      const frac = (x) => el('td', x === b.n ? 'ok' : 'bad', `${x}/${b.n}`);
      tr.append(el('td', null, label), frac(b.pass), frac(b.order), frac(b.turn),
        el('td', null, usd(b.cost)), el('td', null, b.pass ? usd(b.cost / b.pass) : '—'), el('td', null, secs(b.ms / b.n)));
      table.append(tr);
    }
    $('summary').replaceChildren(table);

    const scenarios = [...new Set(results.map((r) => r.vars.scenario))];
    const show = (name) => {
      for (const b of $('nav').children) b.setAttribute('aria-current', b.dataset.name === name);
      const cols = results.filter((r) => r.vars.scenario === name).map(column);
      const grid = el('div', 'grid');
      grid.style.gridTemplateColumns = `repeat(${cols.length}, minmax(380px, 1fr))`;
      grid.append(...cols.map((c) => c.head));
      const rows = Math.max(...cols.map((c) => c.cells.length));
      for (let k = 0; k < rows; k++) grid.append(...cols.map((c) => c.cells[k] ?? el('div', 'turn')));
      if (cols.some((c) => c.tail)) grid.append(...cols.map((c) => c.tail ?? el('div', 'turn')));
      $('main').replaceChildren(grid);
      $('main').scrollTop = 0;
      history.replaceState(null, '', '#' + name);
    };
    $('nav').replaceChildren(...scenarios.map((name) => {
      const b = el('button');
      b.type = 'button';
      b.dataset.name = name;
      b.append(el('span', 'name', name.replaceAll('_', '_​')));
      const marks = el('span', 'marks');
      results.filter((x) => x.vars.scenario === name).forEach((r, i) => {
        if (i) marks.append('  ');
        marks.append(mark(r.success), ` ${r.provider.label}`);
      });
      b.append(marks);
      b.onclick = () => show(name);
      return b;
    }));
    const first = decodeURIComponent(location.hash.slice(1));
    show(scenarios.includes(first) ? first : scenarios[0]);
  }

  const run = new URLSearchParams(location.search).get('run');
  fetch('/runs')
    .then((res) => res.json())
    .then((runs) => {
      const current = run ?? runs[0];
      $('run').replaceChildren(...runs.map((f) => {
        const o = el('option', null, f.replace('.json', '').replace('_', ' '));
        o.value = f;
        o.selected = f === current;
        return o;
      }));
      $('run').onchange = (e) => (location.search = '?run=' + encodeURIComponent(e.target.value));
      return fetch('/results.json' + (current ? '?run=' + encodeURIComponent(current) : ''));
    })
    .then(async (res) => {
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      render(data);
    })
    .catch((err) => $('main').replaceChildren(el('p', 'notice bad', err.message)));
</script>
</body>
</html>
