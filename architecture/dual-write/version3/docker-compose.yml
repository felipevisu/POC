include:
  - ../notification/docker-compose.yml

services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/users
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 2s
      timeout: 3s
      retries: 15
