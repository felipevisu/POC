services:
  notification:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/notifications
      DELAY_MS: "100"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 2s
      timeout: 3s
      retries: 15
